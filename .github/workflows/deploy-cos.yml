name: Deploy portfolio to Tencent COS

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/deploy-cos.yml"
  workflow_dispatch:
    inputs:
      sync_pdf:
        description: "Upload the current portfolio PDF to the fixed COS QR path"
        required: false
        type: boolean
        default: false

concurrency:
  group: tencent-cos-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4
        with:
          # Keep the previous commit available so incremental COS uploads can be detected.
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install COS command line client
        run: python -m pip install --upgrade coscmd

      - name: Configure Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: ${{ vars.COS_BUCKET }}
          COS_REGION: ${{ vars.COS_REGION }}
        run: |
          coscmd config \
            -a "$TENCENT_SECRET_ID" \
            -s "$TENCENT_SECRET_KEY" \
            -b "$COS_BUCKET" \
            -r "$COS_REGION"

      - name: Collect changed portfolio files
        id: changes
        run: |
          file_list="$RUNNER_TEMP/portfolio-files.txt"
          if [ "${{ inputs.sync_pdf }}" = "true" ]; then
            printf '%s\n' "docs/孙琪｜个人设计作品集.pdf" > "$file_list"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            find docs -type f | sort > "$file_list"
          else
            git diff --name-only --diff-filter=AM "${{ github.event.before }}" "${{ github.sha }}" -- docs > "$file_list"
            sed -i '/^$/d' "$file_list"
          fi
          echo "$(wc -l < "$file_list") changed portfolio files ready for upload."

      - name: Upload changed portfolio files with retries
        run: |
          file_list="$RUNNER_TEMP/portfolio-files.txt"
          failed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            remote_path="/${file#docs/}"
            uploaded=false
            for attempt in 1 2 3 4; do
              if timeout 300s coscmd upload -f -y --skipmd5 "$file" "$remote_path"; then
                uploaded=true
                break
              fi
              echo "Retry $attempt/4 for $file"
              sleep $((attempt * 15))
            done
            if [ "$uploaded" != true ]; then
              echo "Failed to upload $file after four attempts."
              failed=1
            fi
          done < "$file_list"
          exit "$failed"
