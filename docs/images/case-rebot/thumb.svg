    <g transform="translate(0 84)">
      <rect width="238" height="36" rx="18" fill="#d6e5dd"/>
      <text x="18" y="24" font-size="15" fill="#26322e">结构理解</text>
    </g>
    <g transform="translate(0 132)">
      <rect width="238" height="36" rx="18" fill="#c8dbd1"/>
