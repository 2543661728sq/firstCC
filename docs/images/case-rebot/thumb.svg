<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">reBot 具身 AI 机械臂学习系统缩略图</title>
  <desc id="desc">深色实验台上展示机械臂模型、手势识别窗口和学习流程界面。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff5f2"/>
      <stop offset=".52" stop-color="#dfe9e4"/>
      <stop offset="1" stop-color="#c9d8d1"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111719"/>
      <stop offset="1" stop-color="#263136"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7f5"/>
      <stop offset=".55" stop-color="#cfd9d4"/>
      <stop offset="1" stop-color="#aab7b0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#15201d" flood-opacity=".2"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <path d="M0 680 C180 600 270 700 430 625 C590 550 760 565 930 515 C1050 480 1130 430 1200 455 L1200 900 L0 900 Z" fill="#edf2ef" opacity=".75"/>
  <g filter="url(#shadow)">
    <rect x="118" y="118" width="964" height="664" rx="18" fill="#f8faf8"/>
    <rect x="154" y="158" width="552" height="456" rx="12" fill="url(#screen)"/>
    <rect x="742" y="158" width="302" height="190" rx="12" fill="#ffffff"/>
    <rect x="742" y="382" width="302" height="232" rx="12" fill="#ffffff"/>
  </g>
  <g transform="translate(220 250)">
    <ellipse cx="205" cy="282" rx="198" ry="34" fill="#000" opacity=".18"/>
    <rect x="112" y="255" width="190" height="40" rx="20" fill="#788880"/>
    <circle cx="206" cy="224" r="62" fill="url(#arm)"/>
    <rect x="188" y="122" width="38" height="126" rx="19" fill="#e6ece8" transform="rotate(-22 207 185)"/>
    <circle cx="174" cy="122" r="42" fill="#cfd9d4"/>
    <rect x="156" y="42" width="190" height="34" rx="17" fill="#dfe6e2" transform="rotate(12 251 59)"/>
    <circle cx="342" cy="75" r="34" fill="#b5c2bb"/>
    <path d="M360 76 L438 32" stroke="#ecb93d" stroke-width="20" stroke-linecap="round"/>
    <path d="M361 83 L446 124" stroke="#ecb93d" stroke-width="20" stroke-linecap="round"/>
    <circle cx="455" cy="28" r="13" fill="#f3d173"/>
    <circle cx="462" cy="128" r="13" fill="#f3d173"/>
  </g>
  <g transform="translate(780 190)">
    <text x="0" y="0" font-family="Noto Sans SC, Arial, sans-serif" font-size="26" font-weight="700" fill="#18211f">Gesture Input</text>
    <rect x="0" y="30" width="126" height="96" rx="10" fill="#e8efeb"/>
    <path d="M42 86 C34 52 58 43 66 66 L70 91" stroke="#192420" stroke-width="8" fill="none" stroke-linecap="round"/>
    <path d="M70 90 L82 48 M86 92 L104 58 M100 98 L122 76" stroke="#192420" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="154" cy="78" r="5" fill="#6cbf82"/>
    <circle cx="177" cy="78" r="5" fill="#6cbf82"/>
    <circle cx="200" cy="78" r="5" fill="#ecb93d"/>
    <text x="0" y="160" font-family="Noto Sans SC, Arial, sans-serif" font-size="18" fill="#4b5a54">摄像头识别手势，映射为学习任务中的选择与确认动作。</text>
  </g>
  <g transform="translate(780 430)" font-family="Noto Sans SC, Arial, sans-serif">
    <text x="0" y="0" font-size="26" font-weight="700" fill="#18211f">Learning Loop</text>
    <g transform="translate(0 36)">
      <rect width="238" height="36" rx="18" fill="#e6eee9"/>
      <text x="18" y="24" font-size="15" fill="#26322e">零件认识</text>
