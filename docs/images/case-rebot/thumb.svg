    </g>
    <path d="M260 55 C318 75 318 132 260 150" fill="none" stroke="#ecb93d" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="154" y="706" font-family="Noto Sans SC, Arial, sans-serif" font-size="42" font-weight="800" fill="#15201d">reBot 具身 AI 机械臂学习系统</text>
  <text x="154" y="748" font-family="Noto Sans SC, Arial, sans-serif" font-size="22" fill="#51615b">手势识别 / 3D 机械臂 / 学习任务 / 实验数据</text>
</svg>
